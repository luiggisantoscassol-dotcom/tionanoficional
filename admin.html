<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachaça do Tio Nan - Loja Oficial</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --gold-metallic: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --bg: #0a0a0a;
            --card: #151515;
        }

        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; padding-bottom: 50px;
        }

        .header-premium {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, #1a1a1a, var(--bg));
        }

        .titulo-premium {
            font-weight: 900;
            text-transform: uppercase;
            background: var(--gold-metallic);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: -1px;
        }

        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .card-produto {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #222;
            text-align: center;
            transition: 0.3s;
        }

        /* Swiper Fix */
        .swiper { width: 100%; height: 320px; border-radius: 15px; margin-bottom: 20px; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .swiper-button-next, .swiper-button-prev { color: var(--gold) !important; transform: scale(0.6); }

        .prod-nome { font-size: 1.3rem; font-weight: 700; margin: 10px 0; color: #eee; }
        .prod-preco { font-size: 1.8rem; font-weight: 900; color: var(--gold); display: block; margin-bottom: 20px; }

        .btn-whats {
            background: var(--gold-metallic);
            color: #000;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            display: inline-block;
            transition: 0.3s;
        }

        .btn-whats:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* Esconder setas no PC para manter o visual limpo se desejar */
        @media (min-width: 1024px) {
            .card-produto:hover { border-color: var(--gold); }
        }
    </style>
</head>
<body>

    <div class="header-premium">
        <h1 class="titulo-premium">Cachaça do Tio Nan</h1>
        <p style="color: #666; font-weight: 700; letter-spacing: 2px;">ARTESANAL • PREMIUM • EXCLUSIVA</p>
    </div>

    <div id="vitrine" class="grid-produtos">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const SHEET_ID = "1MjcWuXWOXJGJ-vyei-C_Zg5SPWCeUd-NFQxLib2G6ho";
        const GID = "0";
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

        async function init() {
            try {
                const res = await fetch(URL + "&cache=" + Date.now());
                const data = await res.text();
                const rows = data.split('\n').slice(1);
                const vitrine = document.getElementById('vitrine');
                vitrine.innerHTML = '';

                rows.forEach((row, index) => {
                    const c = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (!c || c[3].replace(/"/g, '').toLowerCase().trim() !== 'sim') return;

                    const nome = c[1].replace(/"/g, '');
                    const preco = c[2].replace(/"/g, '');
                    // Limpeza pesada nas URLs das fotos
                    const f1 = c[4] ? c[4].replace(/"/g, '').trim() : '';
                    const f2 = c[5] ? c[5].replace(/"/g, '').trim() : '';

                    vitrine.innerHTML += `
                        <div class="card-produto">
                            <div class="swiper mySwiper-${index}">
                                <div class="swiper-wrapper">
                                    <div class="swiper-slide"><img src="${f1}"></div>
                                    ${f2 ? `<div class="swiper-slide"><img src="${f2}"></div>` : ''}
                                </div>
                                <div class="swiper-button-next"></div>
                                <div class="swiper-button-prev"></div>
                            </div>
                            <h2 class="prod-nome">${nome}</h2>
                            <span class="prod-preco">R$ ${preco}</span>
                            <a href="https://wa.me/5551991448888?text=Olá! Quero a ${nome}" class="btn-whats">Pedir Agora</a>
                        </div>
                    `;

                    // Inicia o Swiper para este card específico
                    setTimeout(() => {
                        new Swiper(`.mySwiper-${index}`, {
                            loop: true,
                            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                        });
                    }, 100);
                });
            } catch (err) {
                vitrine.innerHTML = "<p>Erro ao carregar produtos. Verifique a planilha.</p>";
            }
        }
        init();
    </script>
</body>
</html>
